[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobscout"
version = "0.2.2"
description = "Scan job boards, company and research-group websites, and match postings against your applicant profile and interests with an LLM."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "litellm>=1.40",
    "typer>=0.12",
    "pypdf>=4.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.45", "pandas>=2.0", "altair>=5"]
dashboard = ["streamlit>=1.45", "pandas>=2.0", "altair>=5"]  # old name
dev = ["pytest>=8.0"]

[project.scripts]
jobscout = "jobscout.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobscout = ["templates/interview/*", "templates/data/*", "templates/data/profile/*", "templates/data/.github/workflows/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
